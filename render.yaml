# Render Blueprint. Check Render's current free-tier limits before relying on it.
services:
  - type: web
    name: applypilot
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: applypilot-db, property: connectionString }
      - key: APP_PASSWORD
        sync: false          # you type this in the Render dashboard
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: LLM_API_KEY
        sync: false
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: GREENHOUSE_BOARDS
        value: ""
      - key: LEVER_COMPANIES
        value: ""
databases:
  - name: applypilot-db
    plan: free
